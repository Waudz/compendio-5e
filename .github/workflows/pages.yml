name: Publicar versão de testes
# Publica a `main` no GitHub Pages. A publicação DEPENDE da validação (needs): se TypeScript, build ou testes falharem, o deploy não roda.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validar:
    name: Validar antes de publicar
    uses: ./.github/workflows/validar.yml
    permissions:
      contents: read
  deploy:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Só este job recebe permissão de escrita, e só a necessária para o Pages (nenhuma escrita no repositório).
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Compilar com Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gwcttjlxzelzjhbuitmi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Xq4BrPx_YkYGki7Ti2XUzA_ocr-zTWn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
