name: Publicar versão de testes
# Testes e build de publicação no mesmo job: sem instalação ou build duplicados.
# Deploy depende de compilar; falhas de testes ou TypeScript impedem publicação.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  compilar:
    name: Preparar artefato do Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Executar testes antes de publicar
        run: npm test
      - name: Compilar com Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gwcttjlxzelzjhbuitmi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Xq4BrPx_YkYGki7Ti2XUzA_ocr-zTWn
          VITE_COMBATE_REMOTO: '1'
      - name: Garantir que o build oficial não tem o modo experimental
        run: node scripts/check-build-oficial.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar artefato do Alpha
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Separa o upload do deploy em jobs; a API interna usada pelo deploy-pages
      # retornou 0 artefatos mesmo quando a API REST já enxergava o upload.
      - uses: actions/configure-pages@v5
      - name: Confirmar artefato da execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qtd=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
          if [ "$qtd" != "1" ]; then
            echo "::error::Esperado 1 artefato github-pages, encontrados $qtd."
            exit 1
          fi
          echo "Artefato github-pages confirmado."
      - name: Aguardar propagação entre serviços de artefatos
        run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@v5
