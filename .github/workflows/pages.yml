name: Publicar versão de testes
# Publica a `main` no GitHub Pages. A publicação DEPENDE da validação (needs): se TypeScript, build ou testes falharem, o deploy não roda.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validar:
    name: Validar antes de publicar
    uses: ./.github/workflows/validar.yml
    permissions:
      contents: read
  deploy:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Só este job recebe permissão de escrita, e só a necessária para o Pages (nenhuma escrita no repositório).
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Compilar com Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gwcttjlxzelzjhbuitmi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Xq4BrPx_YkYGki7Ti2XUzA_ocr-zTWn
          # Combate e encontros na nuvem + PV/condições na ficha (migrações 0009-0011 já aplicadas ao Supabase 2.0). Remover esta linha volta ao modo local.
          VITE_COMBATE_REMOTO: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # O upload do Pages pode estar finalizado mas ainda não ser visível
      # imediatamente na API de artifacts consultada pelo deploy-pages.
      - name: Aguardar indexação do artefato github-pages
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in $(seq 1 30); do
            qtd=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null) || qtd=""
            if [ "$qtd" = "1" ]; then
              echo "Artefato github-pages encontrado na API (tentativa $tentativa)."
              exit 0
            fi
            if [ "$qtd" -gt 1 ] 2>/dev/null; then
              echo "::error::Foram encontrados $qtd artefatos github-pages nesta execução. Não repita somente jobs falhados; inicie uma nova execução completa."
              exit 1
            fi
            echo "Aguardando artefato github-pages aparecer na API ($tentativa/30)..."
            sleep 3
          done
          echo "::error::Artefato github-pages não apareceu na API no prazo esperado."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
