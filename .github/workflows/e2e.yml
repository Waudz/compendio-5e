name: E2E e responsividade
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # validação completa diária (03:00 em Brasília)
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impacto:
    uses: ./.github/workflows/impacto.yml
  playwright:
    needs: impacto
    # se a classificação falhar, a saída fica vazia e TUDO é validado
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
          - suite: quality
          # a suíte do criador é a mais lenta: dividida em duas metades
          - suite: creator
            shard: 1
          - suite: creator
            shard: 2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        if: needs.impacto.outputs.nivel != 'quick'
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium e dependências do sistema
        if: needs.impacto.outputs.nivel != 'quick'
        run: npx playwright install --with-deps chromium
      - name: Verificar tipos da infraestrutura E2E
        if: needs.impacto.outputs.nivel != 'quick'
        run: npm run test:e2e:types
      - name: Executar suíte ${{ matrix.suite }}
        if: needs.impacto.outputs.nivel != 'quick'
        run: npm run test:${{ matrix.suite }}${{ matrix.shard && format(' -- --shard={0}/2', matrix.shard) || '' }}
      - name: Guardar relatório, capturas e traces
        if: ${{ !cancelled() && needs.impacto.outputs.nivel != 'quick' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
