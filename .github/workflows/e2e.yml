name: E2E e responsividade
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, creator, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium
      - name: Verificar tipos da infraestrutura E2E
        run: npm run test:e2e:types
      - name: Executar suíte ${{ matrix.suite }}
        run: npm run test:${{ matrix.suite }}
      - name: Guardar relatório, capturas e traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
