name: Alpha Supabase isolado
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-supabase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-rest-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar barreiras contra produção
        run: node --test scripts/alpha/local-only.test.mjs
      - name: Preparar projeto descartável sem vínculo remoto
        shell: bash
        run: |
          set -euo pipefail
          alpha_workdir=$(mktemp -d /tmp/compendio-alpha-XXXXXX)
          echo "ALPHA_WORKDIR=$alpha_workdir" >> "$GITHUB_ENV"
          echo "ALPHA_STATUS_FILE=$alpha_workdir/status.json" >> "$GITHUB_ENV"
          npx --yes --package=supabase@3.2.0 supabase init --workdir "$alpha_workdir"
          python3 scripts/alpha/prepare-local.py "$alpha_workdir"
          npx --yes --package=supabase@3.2.0 supabase migration new alpha_combat_fixture --workdir "$alpha_workdir"
          combat_fixture=$(find "$alpha_workdir/supabase/migrations" -name '*_alpha_combat_fixture.sql')
          test -n "$combat_fixture"
          cp docs/sql/alpha-campaign-combats-DRAFT.sql "$combat_fixture"
      - name: Iniciar Auth, PostgREST e PostgreSQL locais
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes --package=supabase@3.2.0 supabase start --workdir "$ALPHA_WORKDIR" > "$ALPHA_WORKDIR/start.log" 2>&1 || { echo 'Falha ao iniciar a stack descartável (log privado não publicado).'; exit 1; }
          npx --yes --package=supabase@3.2.0 supabase status --workdir "$ALPHA_WORKDIR" --output json > "$ALPHA_STATUS_FILE"
      - name: Testar contas reais locais, JWT, RLS e persistência
        env:
          ALPHA_LOCAL_TESTS: '1'
        run: node scripts/alpha/run-local.mjs
      - name: Publicar somente relatório sem credenciais
        uses: actions/upload-artifact@v4
        with:
          name: alpha-local-report
          path: alpha-local-report.json
          if-no-files-found: ignore
      - name: Parar somente a stack descartável
        if: always() && env.ALPHA_WORKDIR != ''
        shell: bash
        run: npx --yes --package=supabase@3.2.0 supabase stop --workdir "$ALPHA_WORKDIR" > /dev/null 2>&1
