name: Alpha Supabase isolado
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # validação completa diária (03:00 em Brasília)
permissions:
  contents: read
concurrency:
  group: alpha-supabase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impacto:
    uses: ./.github/workflows/impacto.yml
  auth-rest-rls:
    needs: impacto
    # se a classificação falhar, a saída fica vazia e TUDO é validado
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar barreiras contra produção
        run: node --test scripts/alpha/local-only.test.mjs
      - name: Preparar projeto descartável sem vínculo remoto
        if: needs.impacto.outputs.nivel != 'quick' && needs.impacto.outputs.nivel != 'functional'
        shell: bash
        run: |
          set -euo pipefail
          alpha_workdir=$(mktemp -d /tmp/compendio-alpha-XXXXXX)
          echo "ALPHA_WORKDIR=$alpha_workdir" >> "$GITHUB_ENV"
          echo "ALPHA_STATUS_FILE=$alpha_workdir/status.json" >> "$GITHUB_ENV"
          npx --yes --package=supabase@3.2.0 supabase init --workdir "$alpha_workdir"
          python3 scripts/alpha/prepare-local.py "$alpha_workdir"
          # as migrações 0009–0011 (combate, encontros, status das fichas) já vêm de supabase/migrations: nada de fixture separada
      - name: Iniciar Auth, PostgREST e PostgreSQL locais
        if: needs.impacto.outputs.nivel != 'quick' && needs.impacto.outputs.nivel != 'functional'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes --package=supabase@3.2.0 supabase start --workdir "$ALPHA_WORKDIR" -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor > "$ALPHA_WORKDIR/start.log" 2>&1 || { node scripts/alpha/start-diagnostics.mjs "$ALPHA_WORKDIR/start.log"; exit 1; }
          npx --yes --package=supabase@3.2.0 supabase status --workdir "$ALPHA_WORKDIR" --output json > "$ALPHA_STATUS_FILE"
      - name: Testar contas reais locais, JWT, RLS e persistência
        if: needs.impacto.outputs.nivel != 'quick' && needs.impacto.outputs.nivel != 'functional'
        env:
          ALPHA_LOCAL_TESTS: '1'
        run: node scripts/alpha/run-local.mjs
      - name: Publicar somente relatório sem credenciais
        if: needs.impacto.outputs.nivel != 'quick' && needs.impacto.outputs.nivel != 'functional'
        uses: actions/upload-artifact@v7
        with:
          name: alpha-local-report
          path: alpha-local-report.json
          if-no-files-found: ignore
      - name: Parar somente a stack descartável
        if: always() && env.ALPHA_WORKDIR != ''
        shell: bash
        run: npx --yes --package=supabase@3.2.0 supabase stop --workdir "$ALPHA_WORKDIR" > /dev/null 2>&1
