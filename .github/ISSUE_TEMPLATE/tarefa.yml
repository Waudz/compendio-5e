name: Tarefa técnica
description: Trabalho técnico delimitado (refatoração, infraestrutura, testes, documentação)
title: "[Tarefa] "
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo e entrega esperada
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: validacao
    attributes:
      label: Como será validado
      description: Testes, build, verificação manual.
  - type: textarea
    id: restricoes
    attributes:
      label: Restrições
      description: Ex.: sem alterar o Supabase, sem merge, sem novas dependências sem aprovação.
