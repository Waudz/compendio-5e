name: Bug
description: Algo não funciona como deveria
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abra...\n2. Clique...\n3. Veja..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado e obtido
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Navegador e dispositivo
      description: Ex.: Edge 130 no Windows; Chrome no Android 14. Informe se o celular é real ou emulado.
  - type: dropdown
    id: dados
    attributes:
      label: Há risco de perda de dados ou de vazamento entre contas/campanhas?
      options: ["Não", "Talvez", "Sim"]
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Capturas de tela ou observações
